<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Messenger Downloader</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="hdr">
      <div class="logo">💌</div>
      <div class="hdr-text">
        <h1>Messenger Downloader</h1>
        <p id="who" class="muted">Đang kết nối…</p>
      </div>
      <button id="btn-refresh" class="icon-btn" title="Tải lại danh sách">⟳</button>
    </header>

    <section id="notice" class="card notice hidden"></section>

    <section id="job" class="card job hidden">
      <div class="job-top">
        <span id="job-title" class="job-title"></span>
        <button id="btn-cancel" class="btn ghost sm">Huỷ</button>
      </div>
      <div class="bar"><div id="job-bar" class="bar-fill"></div></div>
      <p id="job-msg" class="muted small"></p>
    </section>

    <main id="main" class="hidden">
      <div class="search">
        <input id="q" type="search" placeholder="Tìm hội thoại…" autocomplete="off" />
      </div>
      <ul id="threads" class="threads"></ul>
      <details class="manual">
        <summary>Nhập thread ID thủ công</summary>
        <div class="row">
          <input id="manual-id" placeholder="VD: 100012345678901" inputmode="numeric" />
          <button id="btn-manual" class="btn">Tải</button>
        </div>
      </details>
    </main>

    <footer class="muted small">⚠️ Chat 1-1 đã bật mã hoá đầu-cuối sẽ không tải được qua GraphQL.</footer>
    <script src="popup.js"></script>
  </body>
</html>
